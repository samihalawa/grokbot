<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad)" filter="url(#blurGlow)" />
  <circle cx="1000" cy="300" r="160" fill="url(#glowGrad)" filter="url(#blurGlow)" />

  <!-- Top Border Accent Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)" />

  <!-- Left: Branding & Core Message -->
  <g transform="translate(80, 80)">
    <!-- Pill badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#10b981" />
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">NATIVE NODE.JS CLI • 0 DEPS</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5">
      grokbot <tspan fill="#38bdf8">⚡</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Universal Grok Multi-Account Orchestrator &amp; Failover Engine
    </text>

    <!-- Key Badges List -->
    <g transform="translate(0, 160)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="140" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#38bdf8">🔄 Quota Failover</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(150, 0)">
        <rect width="135" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#a78bfa">🌐 OpenAI Proxy</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(295, 0)">
        <rect width="145" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#34d399">📦 3-Layer Export</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(450, 0)">
        <rect width="150" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#f472b6">🎯 Context Routing</text>
      </g>
    </g>

    <!-- Install command pill -->
    <g transform="translate(0, 215)">
      <rect width="360" height="42" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="27" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#f8fafc">
        <tspan fill="#64748b">$</tspan> npm install -g grokbot
      </text>
    </g>
  </g>

  <!-- Right: Sleek Floating Terminal Box -->
  <g transform="translate(680, 50)">
    <!-- Terminal Shadow -->
    <rect width="450" height="300" rx="10" fill="#000" opacity="0.4" transform="translate(10, 10)" />
    <!-- Terminal Background -->
    <rect width="450" height="300" rx="10" fill="#0f121d" stroke="#1e2538" stroke-width="1" />

    <!-- Window Header -->
    <rect width="450" height="36" rx="10" fill="#161b2a" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="225" y="23" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">terminal ~ grokbot pool status</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 60)" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12">
      <text y="0" fill="#64748b">$ <tspan fill="#f8fafc">grokbot pool status</tspan></text>
      <text y="24" fill="#38bdf8">Pinging multi-account cluster...</text>
      
      <text y="54" fill="#10b981">✅ [hao]   haoyunzhu888 (Ultra)</text>
      <text y="74" fill="#64748b">   ↳ Roles: [filing, legal] | Status: 200 OK</text>
      
      <text y="104" fill="#10b981">✅ [sami]  samihalawaster (Super)</text>
      <text y="124" fill="#64748b">   ↳ Roles: [coding, general] | Status: 200 OK</text>
      
      <text y="154" fill="#10b981">✅ [h999]  haoyunzhu999</text>
      <text y="174" fill="#64748b">   ↳ Roles: [regional] | Status: 200 OK</text>

      <text y="206" fill="#a78bfa">⚡ Auto-Failover: Active (Zero Dropped Jobs)</text>
    </g>
  </g>
</svg>
