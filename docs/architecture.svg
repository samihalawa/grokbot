<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192233" />
      <stop offset="100%" stop-color="#111724" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="560" fill="url(#panelBg)" />
  <rect x="0" y="0" width="1100" height="3" fill="url(#blueGlow)" />

  <!-- Header -->
  <g transform="translate(60, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
      grokbot Architecture &amp; Multi-Account Failover Topology
    </text>
    <text y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#64748b">
      High-throughput pooling, specialized knowledge routing, and 3-layer transcript recovery.
    </text>
  </g>

  <!-- COLUMN 1: Client Ingress -->
  <g transform="translate(60, 110)">
    <rect width="220" height="400" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" filter="url(#shadow)" />
    <text x="20" y="35" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">1. INGRESS &amp; CLIENTS</text>
    <line x1="20" y1="48" x2="200" y2="48" stroke="#334155" stroke-width="1" />

    <!-- Ingress item 1 -->
    <g transform="translate(15, 65)">
      <rect width="190" height="60" rx="6" fill="#0b0e14" stroke="#1e293b" />
      <text x="12" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Terminal CLI</text>
      <text x="12" y="42" font-family="monospace" font-size="11" fill="#64748b">grokbot ask / chat</text>
    </g>

    <!-- Ingress item 2 -->
    <g transform="translate(15, 140)">
      <rect width="190" height="60" rx="6" fill="#0b0e14" stroke="#1e293b" />
      <text x="12" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">AI Coding IDEs</text>
      <text x="12" y="42" font-family="monospace" font-size="11" fill="#64748b">Cursor, Codex, Aider</text>
    </g>

    <!-- Ingress item 3 -->
    <g transform="translate(15, 215)">
      <rect width="190" height="60" rx="6" fill="#0b0e14" stroke="#1e293b" />
      <text x="12" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Agent Stdio MCP</text>
      <text x="12" y="42" font-family="monospace" font-size="11" fill="#64748b">Claude Code Plugins</text>
    </g>

    <!-- Ingress item 4 -->
    <g transform="translate(15, 290)">
      <rect width="190" height="60" rx="6" fill="#0b0e14" stroke="#1e293b" />
      <text x="12" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Web Dashboard</text>
      <text x="12" y="42" font-family="monospace" font-size="11" fill="#64748b">http://127.0.0.1:8000</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 285 300 L 345 300" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="345,296 355,300 345,304" fill="#38bdf8" />

  <!-- COLUMN 2: grokbot Orchestration Engine -->
  <g transform="translate(360, 110)">
    <rect width="320" height="400" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
    <text x="20" y="35" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">2. GROKBOT POOL ROUTER</text>
    <line x1="20" y1="48" x2="300" y2="48" stroke="#334155" stroke-width="1" />

    <!-- Feature 1 -->
    <g transform="translate(15, 65)">
      <rect width="290" height="50" rx="6" fill="#0b0e14" stroke="#1e293b" />
      <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🎯 Context &amp; Knowledge Classifier</text>
      <text x="12" y="38" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Auto-detects coding, filing, scrapers, research</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(15, 125)">
      <rect width="290" height="50" rx="6" fill="#0b0e14" stroke="#1e293b" />
      <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#a78bfa">⚖️ Strategy Balancer</text>
      <text x="12" y="38" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Round-Robin • Least-Busy • Sticky-Session</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(15, 185)">
      <rect width="290" height="85" rx="6" fill="#1e1828" stroke="#f59e0b" stroke-width="1" />
      <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">⚠️ Quota Failover Circuit</text>
      <text x="12" y="40" font-family="-apple-system, sans-serif" font-size="11" fill="#fef3c7">• Intercepts HTTP 429 &amp; Token Exhaustion</text>
      <text x="12" y="56" font-family="-apple-system, sans-serif" font-size="11" fill="#fef3c7">• Places Account in 15m Cooldown</text>
      <text x="12" y="72" font-family="-apple-system, sans-serif" font-size="11" fill="#fef3c7">• Reroutes to next healthy candidate</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(15, 280)">
      <rect width="290" height="55" rx="6" fill="#0b0e14" stroke="#1e293b" />
      <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#10b981">🔑 Dynamic Secret Resolver</text>
      <text x="12" y="40" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">1Password CLI (`op`) + Env + Config</text>
    </g>

    <!-- Feature 5 -->
    <g transform="translate(15, 345)">
      <rect width="290" height="42" rx="6" fill="#0b0e14" stroke="#1e293b" />
      <text x="12" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">⚡ SSE Token Streaming Pipeline</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 685 300 L 735 300" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="735,296 745,300 735,304" fill="#38bdf8" />

  <!-- COLUMN 3: Multi-Account Cluster & 3-Layer Stores -->
  <g transform="translate(750, 110)">
    <rect width="290" height="400" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" filter="url(#shadow)" />
    <text x="20" y="35" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#10b981">3. GROK POOL &amp; 3 LAYERS</text>
    <line x1="20" y1="48" x2="270" y2="48" stroke="#334155" stroke-width="1" />

    <!-- Account cluster -->
    <g transform="translate(15, 65)">
      <rect width="260" height="135" rx="6" fill="#0b0e14" stroke="#1e293b" />
      <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Multi-Account Pool Nodes</text>

      <g transform="translate(12, 35)">
        <circle cx="6" cy="6" r="4" fill="#10b981" />
        <text x="16" y="10" font-family="monospace" font-size="11" fill="#cbd5e1">Account A: haoyunzhu888 (Filing)</text>
      </g>
      <g transform="translate(12, 58)">
        <circle cx="6" cy="6" r="4" fill="#10b981" />
        <text x="16" y="10" font-family="monospace" font-size="11" fill="#cbd5e1">Account B: samihalawaster (Code)</text>
      </g>
      <g transform="translate(12, 81)">
        <circle cx="6" cy="6" r="4" fill="#10b981" />
        <text x="16" y="10" font-family="monospace" font-size="11" fill="#cbd5e1">Account C: haoyunzhu999</text>
      </g>
      <g transform="translate(12, 104)">
        <circle cx="6" cy="6" r="4" fill="#10b981" />
        <text x="16" y="10" font-family="monospace" font-size="11" fill="#cbd5e1">Account D: oulang.ai (Scrapers)</text>
      </g>
    </g>

    <!-- 3 Layers of Storage -->
    <g transform="translate(15, 215)">
      <rect width="260" height="165" rx="6" fill="#0b0e14" stroke="#1e293b" />
      <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">3-Layer Exporter Extraction</text>

      <g transform="translate(12, 38)">
        <text y="0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Layer 1: Desktop Persistence Slices</text>
        <text y="14" font-family="monospace" font-size="10" fill="#64748b">sand-client-persistence/*.json</text>
      </g>
      <g transform="translate(12, 78)">
        <text y="0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Layer 2: Web App Chat REST</text>
        <text y="14" font-family="monospace" font-size="10" fill="#64748b">/rest/app-chat/conversations</text>
      </g>
      <g transform="translate(12, 118)">
        <text y="0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Layer 3: Cloud Bot Roster</text>
        <text y="14" font-family="monospace" font-size="10" fill="#64748b">wss://grok.com/ws/bot/</text>
      </g>
    </g>
  </g>
</svg>
